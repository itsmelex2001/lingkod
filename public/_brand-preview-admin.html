<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/sdn/public/css/global.css">
    <link rel="stylesheet" href="/sdn/public/css/admin-portal.css">
    <link rel="stylesheet" href="/sdn/public/css/portal-chrome.css">
    <link rel="stylesheet" href="/sdn/public/css/enterprise-portal.css">
</head>
<body class="portal-layout">
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <div class="sidebar-brand-box">
                    <img src="/sdn/public/assets/v3_lingkod_logo_green.png" alt="LINGKOD">
                </div>
                <div class="brand-text-block">
                    <span class="brand-sub">Mariveles Mental Wellness and General Hospital</span>
                    <span class="brand-title">LINGKOD</span>
                    <span class="brand-role">System Administrator</span>
                </div>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="#" class="nav-link active" data-view="dashboard">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                Overview
            </a>
            <a href="#" class="nav-link" data-view="rbac">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
                User Management
            </a>
            <a href="#" class="nav-link">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                Doctors
            </a>
        </nav>
    </aside>
    <main class="main-content">
        <header class="admin-topbar">
            <div class="admin-topbar-left"><span class="admin-portal-label">Admin Portal</span></div>
        </header>
        <div class="admin-canvas" style="padding:24px;">
            <div class="header-flex"><div><h1>Cross-Department Dashboard</h1><p>Real-time overview of clinical operations.</p></div></div>
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-icon icon-blue"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div><div class="stat-info"><h3>Patients</h3><p>128</p></div></div>
                <div class="stat-card"><div class="stat-icon icon-green"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"></rect></svg></div><div class="stat-info"><h3>Today</h3><p>24</p></div></div>
            </div>
            <div class="custom-table-card" style="margin-top:24px;">
                <table class="data-table">
                    <thead><tr><th>Name</th><th>Department</th><th>Status</th><th></th></tr></thead>
                    <tbody><tr><td>Sample Patient</td><td>Psychiatry</td><td><span class="badge badge-green">Active</span></td><td><button class="btn btn-primary">Complete</button></td></tr></tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
