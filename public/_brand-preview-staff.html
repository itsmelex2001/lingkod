<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Staff preview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/sdn/public/css/staff-dashboard-clean.css">
    <link rel="stylesheet" href="/sdn/public/css/enterprise-portal.css">
</head>
<body>
    <div class="staff-app-container">
        <aside class="staff-sidebar">
            <div>
                <div class="sidebar-brand">
                    <div class="sidebar-brand-box">
                        <img src="/sdn/public/assets/v3_lingkod_logo_green.png" alt="LINGKOD">
                    </div>
                    <div class="brand-text-block">
                        <span class="brand-sub">Mariveles Mental Wellness and General Hospital</span>
                        <span class="brand-title">LINGKOD</span>
                        <span class="brand-role">Psychiatry</span>
                    </div>
                </div>
                <nav class="sidebar-menu">
                    <button type="button" class="sidebar-nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"></rect></svg><span>Consultation</span></button>
                    <button type="button" class="sidebar-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path></svg><span>Records</span></button>
                    <button type="button" class="sidebar-nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"></circle></svg><span>Account Settings</span></button>
                </nav>
            </div>
        </aside>
        <main class="staff-main-wrap">
            <header class="staff-header">
                <div class="header-right-meta">
                    <div class="user-avatar-circle">MS</div>
                    <span class="user-avatar-name">Medical Staff</span>
                </div>
            </header>
            <div class="dashboard-canvas">
                <section class="view-panel active">
                    <div class="view-header">
                        <div><h1>Consultation</h1><p>Review patient bookings and clinic arrivals.</p></div>
                        <div class="view-header-actions">
                            <button type="button" class="btn-clean outline">Doctors Status</button>
                            <button type="button" class="btn-clean primary">Add Walk-in</button>
                        </div>
                    </div>
                    <div class="metrics-grid">
                        <div class="metric-card"><div class="metric-top"><span class="metric-label">Today's Visits</span><span class="metric-dot green"></span></div><div class="metric-value">12</div><div class="metric-sub">Scheduled for today</div></div>
                        <div class="metric-card"><div class="metric-top"><span class="metric-label">For Approval</span><span class="metric-dot amber"></span></div><div class="metric-value">3</div><div class="metric-sub">Pending portal requests</div></div>
                    </div>
                    <div class="content-card">
                        <table class="clean-table">
                            <thead><tr><th>Patient</th><th>Status</th><th>Actions</th></tr></thead>
                            <tbody><tr><td>Sample Patient</td><td><span class="status-pill approved">Approved</span></td><td><button class="btn-clean primary sm">Complete</button></td></tr></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
